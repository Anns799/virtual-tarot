<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Live Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .admin-panel {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #ff4d4d;
            margin-bottom: 20px;
        }
        .screen {
            background: #000;
            border: 1px solid #444;
            padding: 20px;
            border-radius: 5px;
            font-size: 20px;
            color: #00ff66;
            min-height: 80px;
            word-break: break-word;
            margin-bottom: 20px;
        }
        .form-group {
            margin-top: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        textarea {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #555;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            background-color: #00ff66;
            color: black;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

<div class="admin-panel">
    <h2>Admin Live Monitor</h2>
    <p>User jo mic mein bol raha hai (Live Urdu Text):</p>
    <div id="liveOutput" class="screen">Waiting for user...</div>

    <div class="form-group">
        <label>Admin Reply / Answer Box:</label>
        <textarea id="adminAnswer" rows="3" placeholder="User ko bhejne ke liye yahan answer likhein..."></textarea>
    </div>
    <button class="btn" onclick="sendReply()">Send Answer to User</button>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://virtual-tarot-b76aa-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Realtime live text sunna jo user bol raha hai
    const liveOutput = document.getElementById('liveOutput');
    onValue(ref(db, 'liveData/currentText'), (snapshot) => {
        const text = snapshot.val();
        if (text) {
            liveOutput.innerText = text;
        } else {
            liveOutput.innerText = "Waiting for user...";
        }
    });

    // Admin ka answer user tak bhejne ka function
    window.sendReply = function() {
        const answerText = document.getElementById('adminAnswer').value;
        set(ref(db, 'liveData/adminReply'), answerText)
        .then(() => {
            alert("Answer sent successfully to user page!");
        })
        .catch((error) => {
            alert("Error sending answer: " + error.message);
        });
    };
</script>

</body>
</html>
