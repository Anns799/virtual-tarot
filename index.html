<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tarot - Peter Answers Style</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            background-color: #6b1d2f;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #521422;
        }
        #replyDisplay {
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 5px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Virtual Tarot</h2>
    <div class="form-group">
        <label>Petition *</label>
        <input type="text" id="petition" placeholder="e.g. Peter please answer...">
    </div>
    
    <div class="form-group">
        <label>Question *</label>
        <!-- Clean input box: Jab user yahan click karega, mic start ho jayega -->
        <input type="text" id="question" placeholder="Type your question here..." onclick="startSpeechRecognition()">
    </div>

    <button class="btn" onclick="submitForm()">Send question</button>
    
    <!-- Admin ka reply yahan show hoga -->
    <div id="replyDisplay"></div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Aapki Firebase Configuration
    const firebaseConfig = {
      databaseURL: "https://virtual-tarot-b76aa-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let recognition;
    let typedTextBuffer = "";

    window.startSpeechRecognition = function() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            return; // Agar browser support nahi karta toh chup chap ignore karega
        }

        if (!recognition) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ur-PK'; // Urdu language
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    interimTranscript += event.results[i][0].transcript;
                }
                
                let questionInput = document.getElementById('question');
                questionInput.value = interimTranscript;
                
                // Realtime Firebase par bhejna taaki admin live dekh sakay
                set(ref(db, 'liveData/currentText'), interimTranscript);
            };

            recognition.onerror = function(event) {
                console.log("Speech recognition error", event.error);
            };
        }

        try {
            recognition.start();
        } catch (e) {
            // Already started handle
        }
    };

    window.submitForm = function() {
        const q = document.getElementById('question').value;
        if(recognition) {
            recognition.stop();
        }
        set(ref(db, 'liveData/currentText'), q);
        alert("Question submitted successfully!");
    };

    // Admin ke reply ko sunne ke liye listener
    onValue(ref(db, 'liveData/adminReply'), (snapshot) => {
        const reply = snapshot.val();
        const replyDiv = document.getElementById('replyDisplay');
        if (reply) {
            replyDiv.style.display = 'block';
            replyDiv.innerText = "Answer: " + reply;
        }
    });
</script>

</body>
</html>
