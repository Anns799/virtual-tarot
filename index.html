<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tarot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card-container {
            background: white;
            width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #581124;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px 8px 0 0;
            margin: -20px -20px 20px -20px;
        }
        .header h2 { margin: 0; font-size: 22px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .submit-btn {
            background-color: #581124;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover { background-color: #420d1b; }
        .mic-hint { font-size: 11px; color: #666; margin-top: 3px; }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <h2>Virtual Tarot</h2>
            <p>Ask your question and uncover the mystery</p>
        </div>

        <div class="form-group">
            <label>Petition *</label>
            <input type="text" id="petitionInput" value="peter please answer the following question">
        </div>

        <div class="form-group">
            <label>Question * (Mic se bolne ke liye click karein)</label>
            <input type="text" id="questionInput" placeholder="Yahan bolain ya type karein...">
            <div class="mic-hint">💡 Tip: Input box par click karke mic se bolen, admin ko live dikhega!</div>
        </div>

        <button class="submit-btn" onclick="submitQuestion()">Send question</button>
    </div>

    <!-- Firebase SDKs (Compat version v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAemDpPPNGO__dTh8-InzNa38WokRCz9g",
            authDomain: "virtual-tarot-b76aa.firebaseapp.com",
            databaseURL: "https://virtual-tarot-b76aa-default-rtdb.firebaseio.com",
            projectId: "virtual-tarot-b76aa",
            storageBucket: "virtual-tarot-b76aa.firebasestorage.app",
            messagingSenderId: "125719219889",
            appId: "1:125719219889:web:059d98a5e8ed2e91f75c90",
            measurementId: "G-E4399ZE0L0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const questionInput = document.getElementById('questionInput');

        // Speech Recognition (Urdu)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ur-PK'; 
            recognition.continuous = true;
            recognition.interimResults = true;

            questionInput.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch(e) {}
            });

            recognition.onresult = (event) => {
                let text = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    text += event.results[i][0].transcript;
                }
                questionInput.value = text;
                
                // Firebase Database par live update bhejna
                db.ref('liveQuestion').set({ text: text });
            };
        }

        // Agar keyboard se type kare toh bhi live jaye
        questionInput.addEventListener('input', (e) => {
            db.ref('liveQuestion').set({ text: e.target.value });
        });

        function submitQuestion() {
            alert("Question sent successfully!");
        }
    </script>
</body>
</html>
